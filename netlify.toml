[build]
  base = ""
  publish = "."
  functions = "netlify/functions"
  command = "echo 'Static site ready'"

[[redirects]]
  from = "/api/listings"
  to = "/.netlify/functions/listings"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
