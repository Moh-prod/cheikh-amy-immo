[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/listings"
  to = "/.netlify/functions/listings"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "public, max-age=60, s-maxage=60"
    Access-Control-Allow-Origin = "*"
